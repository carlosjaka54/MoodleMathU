services:
  moodle:
    build: .
    container_name: moodle_app
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./moodledata:/var/www/moodledata
    depends_on:
      - db
    command: bash -c "apt-get update && apt-get install -y libzip-dev libicu-dev libpng-dev libxml2-dev && docker-php-ext-install mysqli pdo pdo_mysql zip intl gd soap exif && echo 'max_input_vars = 5000' > /usr/local/etc/php/php.ini && apache2-foreground"

  db:
    image: mariadb:10.11
    container_name: moodle_db
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: moodle
      MYSQL_USER: moodleuser
      MYSQL_PASSWORD: moodlepass
    ports:
      - "3307:3306"
    volumes:
      - moodle_db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: moodle_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root

volumes:
  moodle_db_data: