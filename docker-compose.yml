services:
  moodle:
    image: php:8.3-apache
    container_name: moodle_app
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    command: >
      bash -c "
      apt-get update && apt-get install -y \
        libzip-dev \
        libicu-dev \
        libpng-dev &&
      docker-php-ext-install mysqli pdo pdo_mysql zip intl gd &&
      apache2-foreground
      "

  db:
    image: mysql:8.0
    container_name: moodle_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: moodle
      MYSQL_USER: moodleuser
      MYSQL_PASSWORD: moodlepass
    ports:
      - "3307:3306"
    volumes:
      - moodle_db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: moodle_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root

volumes:
  moodle_db_data: